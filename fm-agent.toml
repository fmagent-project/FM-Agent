# FM-Agent configuration (committed, non-secret).
#
# Precedence (highest wins): process env > secrets.env > this file > built-in defaults.
# Each setting is also overridable by the environment variable shown in the
# trailing comment. Secrets (the LLM API key) stay in secrets.env — never here.
# What each setting does, with defaults: see docs/configuration.md

[llm]
name      = "qwen3.6-35b-a3b"                                    # LLM_MODEL
base_url  = "https://dashscope.aliyuncs.com/compatible-mode/v1"  # LLM_API_BASE_URL
backend   = "deepseek-harness"                                  # FM_AGENT_MODEL_BACKEND
effort    = ""                                 # LLM_EFFORT — reasoning-effort hint ("", low, medium, high)
api_style = "openai"                           # LLM_API_STYLE — openai | anthropic
harness_bin = ""                               # FM_AGENT_DSH_BIN — normally supplied by the offline launcher
harness_patch = ""                             # FM_AGENT_DSH_PATCH — normally supplied by the offline launcher
tool_compat_mode = "native"                    # FM_AGENT_TOOL_COMPAT_MODE — native | qwen-text

[runtime]
max_workers                = 10    # MAX_WORKERS
max_spec_iter              = 5     # MAX_SPC_ITER
granularity                = 40    # GRANULARITY
agent_max_retries = 5     # AGENT_MAX_RETRIES
agent_timeout_s   = 1800  # AGENT_TIMEOUT_SECONDS — hard cap on one headless Harness task

[scope]
top_k                    = 5    # SCOPE_TOP_K
llm_trigger_funcs        = 5    # SCOPE_LLM_TRIGGER_FUNCS
llm_top_k                = 5    # SCOPE_LLM_TOP_K
llm_confidence_threshold = 8.0  # SCOPE_LLM_CONFIDENCE_THRESHOLD

[erlang]
command   = "elp"   # ELP_COMMAND
timeout_s = 180     # ELP_TIMEOUT_SECONDS

[codegraph]
# The pinned codegraph build. install.sh reads these to install it, and the
# runtime invokes that pinned binary — so this is the single place that decides
# "which codegraph": bump `version` (and `repo`), then re-run ./install.sh to
# switch. This maintenance-fork release re-hosts upstream v1.6.0, which
# carries the C macro-attribute extraction fix natively. The fork build's updater
# points back at the fork, so `codegraph upgrade` won't self-replace it with the
# upstream build.
repo    = "fmagent-project/codegraph"   # CODEGRAPH_REPO
version = "v1.6.0-fmagent.1"            # CODEGRAPH_VERSION
bin_dir = "~/.local/bin"                # CODEGRAPH_BIN_DIR — where the codegraph launcher is installed and invoked from

# FM-Agent configuration (committed, non-secret).
#
# Precedence (highest wins):  process env  >  .env  >  this file  >  built-in defaults.
# Each setting is also overridable by the legacy environment variable shown in the
# trailing comment. Secrets (the LLM API key) stay in .env — never here.
# What each setting does, with defaults: see docs/configuration.md

[llm]
name      = "anthropic/claude-sonnet-4.6"    # LLM_MODEL
provider  = "openrouter"                       # OPENCODE_MODEL_PROVIDER — the OpenCode provider id FM-Agent generates
base_url  = "https://openrouter.ai/api/v1"     # LLM_API_BASE_URL
backend   = "opencode"                         # FM_AGENT_MODEL_BACKEND — opencode | auto | codex-cli | claude-cli
effort    = ""                                 # LLM_EFFORT — reasoning-effort hint ("", low, medium, high)
api_style = "openai"                            # LLM_API_STYLE — endpoint style for the OpenCode adapter: openai | anthropic

[runtime]
max_workers                = 10    # MAX_WORKERS
max_spec_iter              = 5     # MAX_SPC_ITER
granularity                = 40    # GRANULARITY
opencode_max_retries       = 5     # OPENCODE_MAX_RETRIES
bug_validation_max_retries = 1     # BUG_VALIDATION_MAX_RETRIES
opencode_timeout_s         = 1800  # OPENCODE_TIMEOUT_SECONDS — hard cap on one `opencode run`

[scope]
top_k                    = 5    # SCOPE_TOP_K
llm_trigger_funcs        = 5    # SCOPE_LLM_TRIGGER_FUNCS
llm_top_k                = 5    # SCOPE_LLM_TOP_K
llm_confidence_threshold = 8.0  # SCOPE_LLM_CONFIDENCE_THRESHOLD

[erlang]
command   = "elp"   # ELP_COMMAND
timeout_s = 180     # ELP_TIMEOUT_SECONDS

[codegraph]
# The pinned codegraph build — the single place that decides "which codegraph".
# Bumping `version` is the whole switch: the runtime resolves that exact release
# and installs it if the machine lacks it, so a `git pull` is enough. A newer
# codegraph installed elsewhere is not preferred either — call resolution differs
# between releases, and a bug report has to name a reproducible version.
# This maintenance-fork build re-hosts upstream v1.6.0, which carries the
# Rust field-receiver and generic-impl fixes and Erlang per-arity identity, and
# adds one patch of its own: FM-Agent's work directory is excluded from the index
# by default, so an analysed project is not indexed with a second copy of every
# function this tool extracted from it. The fork build's updater points back at
# the fork, so `codegraph upgrade` won't self-replace it with the upstream build.
repo    = "fmagent-project/codegraph"   # CODEGRAPH_REPO
version = "v1.6.0-fmagent.1"            # CODEGRAPH_VERSION
bin_dir = "~/.local/bin"                # CODEGRAPH_BIN_DIR — where install.sh links codegraph for manual command-line use
# Our own bundle directory, deliberately not the shared ~/.codegraph: codegraph's
# installer deletes every other release under its install dir and re-points
# ~/.local/bin/codegraph, so the two would keep overwriting each other. Holds one
# release at a time (~278 MB); bumping `version` replaces it.
install_dir    = "~/.cache/fm-agent/codegraph"  # FM_AGENT_CODEGRAPH_DIR
